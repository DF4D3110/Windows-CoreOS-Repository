name: Download Internet Archive Item

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Internet Archive detail URL or identifier"
        required: true
        default: "https://archive.org/details/15254.0.feature2.20171001-1506_Selfhost_rs2.bin.arm64fre.WM.MC"
        type: string
      retention_days:
        description: "Artifact retention days"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  download:
    name: Download IA item
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Internet Archive CLI
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            internetarchive

      - name: Parse input address
        id: parse
        shell: bash
        env:
          SOURCE_ADDRESS: ${{ inputs.address }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          raw = os.environ["SOURCE_ADDRESS"].strip()

          if not raw:
              raise SystemExit("The address cannot be empty.")

          if "://" in raw:
              parsed = urlparse(raw)
              host = (parsed.hostname or "").lower()

              if host not in {"archive.org", "www.archive.org"}:
                  raise SystemExit(
                      "Only archive.org detail URLs are supported."
                  )

              parts = [
                  unquote(part)
                  for part in parsed.path.split("/")
                  if part
              ]

              if len(parts) < 2 or parts[0] != "details":
                  raise SystemExit(
                      "Use a URL such as https://archive.org/details/<identifier>"
                  )

              identifier = parts[1]
          else:
              identifier = raw.strip("/")

          if not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._-]*",
              identifier
          ):
              raise SystemExit(
                  "The identifier contains unsupported characters."
              )

          Path("result").mkdir(parents=True, exist_ok=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"identifier={identifier}\n")

          print(f"Using Internet Archive identifier: {identifier}")
          PY

      - name: Download item metadata
        shell: bash
        env:
          IDENTIFIER: ${{ steps.parse.outputs.identifier }}
        run: |
          set -Eeuo pipefail

          mkdir -p result/files

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://archive.org/metadata/${IDENTIFIER}" \
            --output result/item-metadata.json

          printf '%s\n' "${IDENTIFIER}" > result/identifier.txt
          printf 'https://archive.org/details/%s\n' "${IDENTIFIER}" \
            > result/source-url.txt

      - name: Download all public files
        shell: bash
        env:
          IDENTIFIER: ${{ steps.parse.outputs.identifier }}
        run: |
          set -Eeuo pipefail

          ia download \
            --destdir result/files \
            --retries 5 \
            --no-partial \
            --verbose \
            "${IDENTIFIER}"

      - name: Upload downloaded item as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-${{ steps.parse.outputs.identifier }}-${{ github.run_id }}
          path: result
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
